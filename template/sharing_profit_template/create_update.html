<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{if .IsEdit}}Edit Sharing Profit{{else}}New Sharing Profit{{end}}</h3>
    <a href="/sharing-profits" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <form method="POST" action="{{if .IsEdit}}/sharing-profits/{{.SharingProfit.SharingProfitNum}}/{{.SharingProfit.SharingProfitID}}/edit{{else}}/sharing-profits/create{{end}}">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Sharing Profit Num</label>
          <input type="number" name="sharing_profit_num" class="form-control"
                 value="{{.SharingProfit.SharingProfitNum}}" {{if .IsEdit}}disabled{{else}}required{{end}}>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Sharing Profit ID</label>
          <input type="text" name="sharing_profit_id" class="form-control" maxlength="15"
                 value="{{.SharingProfit.SharingProfitID}}" {{if .IsEdit}}disabled{{else}}required{{end}}>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Commitment ID</label>
        <input type="number" name="commitment_id" class="form-control"
               value="{{if .SharingProfit.CommitmentID}}{{.SharingProfit.CommitmentID}}{{end}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Order DO Detail No</label>
        <input type="text" name="order_do_dtno" class="form-control" maxlength="20"
               value="{{.SharingProfit.OrderDoNo}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Share Value</label>
        <input type="number" step="0.01" name="share_value" class="form-control"
               value="{{.SharingProfit.ShareValue}}">
      </div>
      <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save Changes{{else}}Create{{end}}</button>
      <a href="/sharing-profits" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
