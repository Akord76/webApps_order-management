<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{if .IsEdit}}Edit User{{else}}New User{{end}}</h3>
    <a href="/users" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <form method="POST" action="{{if .IsEdit}}/users/{{.User.UserID}}/edit{{else}}/users/create{{end}}">
      {{if .IsEdit}}
      <div class="mb-3">
        <label class="form-label">User ID</label>
        <input type="text" class="form-control" value="{{.User.UserID}}" disabled>
      </div>
      {{end}}

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" value="{{.User.Username}}"
               {{if .IsEdit}}disabled{{else}}required{{end}}>
      </div>

      {{if not .IsEdit}}
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" minlength="6" required>
      </div>
      {{end}}

      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" maxlength="100" value="{{.User.FullName}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" maxlength="100" value="{{.User.Email}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role_name" class="form-select">
          <option value="ADMIN" {{if eq .User.RoleName "ADMIN"}}selected{{end}}>ADMIN</option>
          <option value="MANAGER" {{if eq .User.RoleName "MANAGER"}}selected{{end}}>MANAGER</option>
          <option value="USER" {{if or (eq .User.RoleName "USER") (not .IsEdit)}}selected{{end}}>USER</option>
        </select>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
               value="true" {{if or .User.IsActive (not .IsEdit)}}checked{{end}}>
        <label class="form-check-label" for="isActive">Active</label>
      </div>

      <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save Changes{{else}}Create{{end}}</button>
      <a href="/users" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
