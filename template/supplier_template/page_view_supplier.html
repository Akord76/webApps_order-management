<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Suppliers</h3>
    <a href="/suppliers/create" class="btn btn-primary">+ New Supplier</a>
  </div>

  {{template "alerts" .}}

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Supplier No</th>
            <th>Supplier ID</th>
            <th>Name</th>
            <th>City</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          {{range .Suppliers}}
          <tr>
            <td>{{.SupplierNumber}}</td>
            <td>{{.SupplierID}}</td>
            <td>{{.SupplierName}}</td>
            <td>{{.City}}</td>
            <td class="text-end">
              <a href="/suppliers/{{.SupplierNumber}}/{{.SupplierID}}" class="btn btn-sm btn-outline-secondary">View</a>
              <a href="/suppliers/{{.SupplierNumber}}/{{.SupplierID}}/edit" class="btn btn-sm btn-outline-primary">Edit</a>
              <form method="POST" action="/suppliers/{{.SupplierNumber}}/{{.SupplierID}}/delete" class="d-inline"
                    onsubmit="return confirm('Delete this supplier?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
              </form>
            </td>
          </tr>
          {{else}}
          <tr><td colspan="5" class="text-center text-muted py-4">No suppliers found.</td></tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
