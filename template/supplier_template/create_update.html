<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{if .IsEdit}}Edit Supplier{{else}}New Supplier{{end}}</h3>
    <a href="/suppliers" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <form method="POST" action="{{if .IsEdit}}/suppliers/{{.Supplier.SupplierNumber}}/{{.Supplier.SupplierID}}/edit{{else}}/suppliers/create{{end}}">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Supplier Number</label>
          <input type="text" class="form-control" value="{{.Supplier.SupplierNumber}}" disabled>
          <div class="form-text">{{if not .IsEdit}}Assigned automatically by the server.{{end}}</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Supplier ID</label>
          <input type="text" name="supplier_id" class="form-control" maxlength="20"
                 value="{{.Supplier.SupplierID}}" {{if .IsEdit}}disabled{{end}} required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Supplier Name</label>
        <input type="text" name="supplier_name" class="form-control" maxlength="50" value="{{.Supplier.SupplierName}}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" name="address" class="form-control" maxlength="100" value="{{.Supplier.Address}}">
      </div>
      <div class="mb-3">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" maxlength="25" value="{{.Supplier.City}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Contact Person</label>
        <input type="text" name="contact_person" class="form-control" maxlength="25" value="{{.Supplier.ContactPerson}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" maxlength="50" value="{{.Supplier.Email}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="text" name="phone_number" class="form-control" maxlength="20" value="{{.Supplier.PhoneNumber}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Bank Number</label>
        <input type="text" name="bank_number" class="form-control" maxlength="20" value="{{.Supplier.BankNumber}}">
      </div>
      <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save Changes{{else}}Create{{end}}</button>
      <a href="/suppliers" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
