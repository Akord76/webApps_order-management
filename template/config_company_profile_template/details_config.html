<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Setting Detail</h3>
    <a href="/config-company-profiles" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <dl class="row mb-0">
      <dt class="col-sm-4">Config ID</dt>
      <dd class="col-sm-8">{{.Config.ConfigID}}</dd>

      <dt class="col-sm-4">Profile</dt>
      <dd class="col-sm-8">{{.Config.ConfigCompanyProfile}}</dd>

      <dt class="col-sm-4">Profile 1</dt>
      <dd class="col-sm-8">{{.Config.ConfigCompanyProfile1}}</dd>
    </dl>
    <div class="mt-3">
      <a href="/config-company-profiles/{{.Config.ConfigID}}/edit" class="btn btn-primary">Edit</a>
      <form method="POST" action="/config-company-profiles/{{.Config.ConfigID}}/delete" class="d-inline"
            onsubmit="return confirm('Delete this setting?');">
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
