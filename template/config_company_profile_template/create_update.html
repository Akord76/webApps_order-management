<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{if .IsEdit}}Edit Setting{{else}}New Setting{{end}}</h3>
    <a href="/config-company-profiles" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <form method="POST" action="{{if .IsEdit}}/config-company-profiles/{{.Config.ConfigID}}/edit{{else}}/config-company-profiles/create{{end}}">
      <div class="mb-3">
        <label class="form-label">Config ID</label>
        <input type="text" name="config_id" class="form-control"
               value="{{.Config.ConfigID}}" {{if .IsEdit}}disabled{{else}}required{{end}}>
        <div class="form-text">{{if not .IsEdit}}Not auto-generated - pick a unique ID.{{end}}</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Profile</label>
        <input type="text" name="config_company_profile" class="form-control" maxlength="50"
               value="{{.Config.ConfigCompanyProfile}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Profile 1</label>
        <input type="text" name="config_company_profile_1" class="form-control" maxlength="50"
               value="{{.Config.ConfigCompanyProfile1}}">
      </div>
      <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save Changes{{else}}Create{{end}}</button>
      <a href="/config-company-profiles" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
