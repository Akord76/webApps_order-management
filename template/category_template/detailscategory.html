<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Category Detail</h3>
    <a href="/categories" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <dl class="row mb-0">
      <dt class="col-sm-4">Category ID</dt>
      <dd class="col-sm-8">{{.Category.CategoryID}}</dd>

      <dt class="col-sm-4">Category Name</dt>
      <dd class="col-sm-8">{{.Category.CategoryName}}</dd>
    </dl>
    <div class="mt-3">
      <a href="/categories/{{.Category.CategoryID}}/edit" class="btn btn-primary">Edit</a>
      <form method="POST" action="/categories/{{.Category.CategoryID}}/delete" class="d-inline"
            onsubmit="return confirm('Delete this category?');">
        <button type="submit" class="btn btn-danger">Delete</button>
      </form>
    </div>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
