<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{if .IsEdit}}Edit Category{{else}}New Category{{end}}</h3>
    <a href="/categories" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <form method="POST" action="{{if .IsEdit}}/categories/{{.Category.CategoryID}}/edit{{else}}/categories/create{{end}}">
      {{if .IsEdit}}
      <div class="mb-3">
        <label class="form-label">Category ID</label>
        <input type="text" class="form-control" value="{{.Category.CategoryID}}" disabled>
      </div>
      {{end}}
      <div class="mb-3">
        <label class="form-label">Category Name</label>
        <input type="text" name="category_name" class="form-control" maxlength="25"
               value="{{.Category.CategoryName}}" required>
      </div>
      <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save Changes{{else}}Create{{end}}</button>
      <a href="/categories" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
