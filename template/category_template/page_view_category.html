<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}</head>
<body>
{{template "navbar" .}}
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Categories</h3>
    <a href="/categories/create" class="btn btn-primary">+ New Category</a>
  </div>

  {{template "alerts" .}}

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          {{range .Categories}}
          <tr>
            <td>{{.CategoryID}}</td>
            <td>{{.CategoryName}}</td>
            <td class="text-end">
              <a href="/categories/{{.CategoryID}}" class="btn btn-sm btn-outline-secondary">View</a>
              <a href="/categories/{{.CategoryID}}/edit" class="btn btn-sm btn-outline-primary">Edit</a>
              <form method="POST" action="/categories/{{.CategoryID}}/delete" class="d-inline"
                    onsubmit="return confirm('Delete this category?');">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
              </form>
            </td>
          </tr>
          {{else}}
          <tr><td colspan="3" class="text-center text-muted py-4">No categories found.</td></tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
</div>
{{template "footer" .}}
</body>
</html>
