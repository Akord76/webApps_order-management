<!DOCTYPE html>
<html lang="en">
<head>
  {{template "head" .}}
  <!-- Memanggil CSS di bagian <head> -->
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{if .IsEdit}}Edit Commitment Fee{{else}}New Commitment Fee{{end}}</h3>
    <a href="/commitmentfees" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <form method="POST" 
          action="{{if .IsEdit}}/commitmentfees/{{if .CommitmentFee}}{{.CommitmentFee.CommitmentID}}{{end}}/edit{{else}}/commitmentfees/create{{end}}">
      
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Commitment Fee ID</label>
          <input type="number" 
                 name="commitment_id" 
                 class="form-control"
                 value="{{if .CommitmentFee}}{{.CommitmentFee.CommitmentID}}{{end}}" 
                 {{if .IsEdit}}readonly{{else}}required{{end}}>
        </div>
      </div>

      <!-- Form Employee (Autocomplete) -->
      <div class="mb-3 position-relative">
          <label for="employee_search" class="form-label">Search Employee</label>
          <input type="text" id="employee_search" 
                 class="form-control" 
                 placeholder="Types Employee Name..."
                 value="{{if .CommitmentFee}}{{.CommitmentFee.CompleteName}}{{end}}">
          
          <ul id="suggestions" class="list-group position-absolute w-100 shadow-sm" style="display:none; z-index:1000; max-height:200px; overflow-y:auto;"></ul>
          
          <!-- Hidden Input untuk EmployeeCardNumber (int) -->
          <input type="hidden" 
                 id="employee_card_number" 
                 name="employee_card_number"
                 value="{{if .CommitmentFee}}{{.CommitmentFee.EmployeeCardNumber}}{{end}}"
                 required>
          
          <input type="text" 
                 id="display_card_number" 
                 class="form-control mt-2" 
                 readonly 
                 placeholder="No. Kartu Karyawan"
                 value="{{if .CommitmentFee}}{{.CommitmentFee.EmployeeCardNumber}}{{end}}">
      </div>

      <div class="mb-3">
        <label class="form-label">Commitment Value</label>
        <input type="number" 
               step="0.01" 
               name="commitment_value" 
               class="form-control"
               value="{{if .CommitmentFee}}{{.CommitmentFee.CommitmentValue}}{{end}}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Parameter Fee</label>
        <input type="number" 
               name="parameter_fee" 
               class="form-control"
               value="{{if .CommitmentFee}}{{.CommitmentFee.ParameterFee}}{{end}}" required>
      </div>
      
      <!-- Form Products (Autocomplete) -->
      <div class="mb-3 position-relative">
          <label for="productName" class="form-label">Search Product</label>
          
          <input type="text" 
                 id="productName" 
                 class="form-control" 
                 placeholder="Types Product Name..." 
                 value="{{if .CommitmentFee}}{{.CommitmentFee.ProductName}}{{end}}"
                 autocomplete="off">

          <!-- Hidden Input untuk ProductID (string) - WAJIB TERISI -->
          <input type="hidden" 
                 id="productId" 
                 name="product_id" 
                 value="{{if .CommitmentFee}}{{.CommitmentFee.ProductID}}{{end}}"
                 required>

          <input type="hidden" id="measure" name="measure">
      </div>

      <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save Changes{{else}}Create{{end}}</button>
      <a href="/commitmentfees" class="btn btn-light">Cancel</a>
    </form>
  </div>
</div>
{{template "footer" .}}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/load_autocomplete.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        AppAutocomplete.initEmployee();
        AppAutocomplete.initProduct();
    });
</script>
</body>
</html>
