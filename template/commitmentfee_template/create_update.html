<!DOCTYPE html>
<html lang="en">
<head>{{template "head" .}}
  <style>
        .autocomplete-wrapper {
            position: relative;
            width: 350px;
        }
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ccc;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
        }
        .suggestions-list li {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .suggestions-list li:hover {
            background-color: #f0f0f0;
        }
        .suggestions-list .email {
            font-size: 0.85em;
            color: #666;
            display: block;
        }
    </style>
</head>
<body>
{{template "navbar" .}}
<div class="container" style="max-width: 640px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>{{if .IsEdit}}Edit Commitment Fee{{else}}New Commitment Fee{{end}}</h3>
    <a href="/commitmentfees" class="btn btn-outline-secondary">Back</a>
  </div>

  {{template "alerts" .}}

  <div class="card p-4">
    <form method="POST" action="{{if .IsEdit}}/commitmentfees/{{.CommitmentFee.CommitmentFeeID}}/edit{{else}}/commitmentfees/create{{end}}">
      <div class="row">
	
        <div class="col-md-6 mb-3">
          <label class="form-label">Commitment Fee ID</label>
          <input type="text" 
                 name="commitment_id" 
                 class="form-control" maxlength="15"
                 value="{{.CommitmentFee.CommitmentID}}" {{if .IsEdit}}disabled{{else}}required{{end}}>
        </div>
     </div>
      <!-- Form Employees -->
        <div class="mb-3 position-relative">
            <label for="employee_search" class="form-label">Search Employees</label>
            <input type="text" id="employee_search" class="form-control" placeholder="Ketik nama karyawan...">
            <ul id="suggestions" class="list-group position-absolute w-100 shadow-sm" style="display:none; z-index:1000; max-height:200px; overflow-y:auto;"></ul>
            <input type="hidden" 
                   id="employee_card_number" 
                   name="employee_card_number"
                   value="{{.CommitmentFee.EmployeeCardNumber}}">
            <input type="text" id="display_card_number" class="form-control mt-2" readonly placeholder="No. Kartu Karyawan">
        </div>

      <div class="mb-3">
        <label class="form-label">Commitment Value</label>
        <input type="number" 
               step="0.01" 
               name="commitment_value" 
               class="form-control"
               value="{{.CommitmentFee.CommitmentValue}}">
      </div>
      <div class="mb-3">
        <label class="form-label">Parameter Fee</label>
        <input type="number" step="0.01" name="parameter_fee" 
               class="form-control"
               value="{{.CommitmentFee.ParameterFee}}">
      </div>
      
      <!-- Form Products -->
<div class="mb-3 position-relative">
    <label for="productName" class="form-label">Search Products</label>
    
    <!-- Input Autocomplete -->
    <input type="text" 
           id="productName" 
           class="form-control" 
           placeholder="Types Product Name..." 
           autocomplete="off">

    <!-- Input Hidden ProductID (name="product_id" WAJIB SESUAI DENGAN BACKEND) -->
    <input type="text" 
           id="productId" 
           name="product_id" 
           value="{{if .CommitmentFee.ProductID}}{{.CommitmentFee.ProductID}}{{end}}">

    <!-- Input Hidden Measure -->
    <input type="text" 
           id="measure" 
           name="measure">
</div>
      <button type="submit" class="btn btn-primary">{{if .IsEdit}}Save Changes{{else}}Create{{end}}</button>
      <a href="/commitmentfees" class="btn btn-light">Cancel</a>
    </form>

    

  </div>
</div>
{{template "footer" .}}

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Script File -->
    <script src="/static/js/load_autocomplete.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Inisialisasi Autocomplete Karyawan
            AppAutocomplete.initEmployee();

            // Inisialisasi Autocomplete Produk
            AppAutocomplete.initProduct();
        });
    </script>
</body>
</html>
